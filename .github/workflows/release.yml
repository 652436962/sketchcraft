# Push a tag like v0.2.0 to build SketchCraft for macOS, Windows and Linux
# and attach the installers (plus the headless CLI, the portable ZIP and
# SHA-256 checksums) to a DRAFT GitHub release. Nothing is public until you
# review it and click "Publish release".
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the jobs that put files on the draft release get
# write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment); Dependabot (.github/dependabot.yml) proposes updates.
#
# How the update-signing key is kept away from npm code:
#   - The web UI is built in its own job (`frontend`), which has no secrets.
#     The installer jobs download that build instead of running
#     `npm run build`: tauri's beforeBuildCommand is switched off for them
#     with a --config override.
#   - Installer jobs install npm packages with --ignore-scripts, so no
#     package install script runs there.
#   - Apple signing secrets are given to the one build step that signs, never
#     written to the job environment.
#   - Compiling is separate from signing. The `build` job compiles with
#     `cargo build --locked` semantics (`-- --locked`) and holds no secrets and
#     a read-only token (the Apple secrets, once added, go to one step). The
#     `publish` job signs the update packages with the real key and makes the
#     draft release; it compiles nothing, so no dependency build script or
#     proc-macro ever runs next to the key. Only the pinned Tauri CLI
#     (`signer sign`, installed with --ignore-scripts) and a short script run there.
# The `publish` job names a GitHub Environment, `release`: put the signing
# secrets in it with required reviewers, and add a tag protection rule
# (ruleset) for v* tags so only the maintainer can start a release
# (docs/SIGNING.md). Those are repository settings only the owner can turn on.

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # A release is a v* tag on a commit that's on main, and it names the app's own version.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the app version, and the commit is on main
        run: |
          app=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${app}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match app version ${app}."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} isn't on main. Releases are cut from main."
            exit 1
          fi

  # The web UI, built once without any secrets. The installers embed it.
  frontend:
    needs: [checks, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  # Compiles and bundles the installers. This job has NO secrets: every Rust
  # build script, proc-macro and npm package runs here without the update-signing
  # key and without a token that can write to the repository. (The update
  # packages it makes are signed with a throwaway key made fresh for the run;
  # the `publish` job signs them for real.)
  build:
    needs: [frontend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # set once the Apple secrets are added (see docs/SIGNING.md); only says
      # whether they exist, the values are never put in the environment
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Only for the Tauri CLI; no install scripts run.
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      # The web UI from the `frontend` job, where tauri.conf.json's frontendDist
      # (app/dist) expects it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: app/dist
      # Turns off beforeBuildCommand (`npm run build`) for this build: the UI is already built.
      - name: Skip the frontend build hook
        shell: bash
        run: echo '{"build":{"beforeBuildCommand":""}}' > "$RUNNER_TEMP/tauri-release.json"
      # Tauri makes its update packages (and their signatures) while bundling, so it needs
      # a key. This one is made here, used here and thrown away; its signatures are discarded.
      - name: Make a throwaway key for the build
        shell: bash
        working-directory: app
        run: npx --no-install tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway.key"

      # macOS with Apple signing + notarization: the Apple secrets go to this one step.
      - name: Build, sign and notarize (macOS)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri-release.json -- --locked

      # Everything else (and macOS before the Apple secrets exist): no secrets at all.
      - name: Build
        if: matrix.platform != 'macos-latest' || env.HAS_APPLE != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri-release.json -- --locked

      # Windows: the app as a ZIP too, to run from any folder (no installer).
      # PORTABLE.txt tells it to offer the new ZIP instead of installing updates.
      - name: Portable ZIP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable/SketchCraft | Out-Null
          Copy-Item target/release/sketchcraft-app.exe portable/SketchCraft/SketchCraft.exe
          Set-Content portable/SketchCraft/PORTABLE.txt "SketchCraft runs from this folder: unzip anywhere and open SketchCraft.exe. It needs Microsoft Edge WebView2, which Windows 10 and 11 include. When a new version is out, SketchCraft links to the newest portable ZIP."
          New-Item -ItemType Directory -Force extras | Out-Null
          Compress-Archive -Path portable/SketchCraft -DestinationPath "extras/SketchCraft_${v}_x64_portable.zip"
      - name: Keep the portable ZIP for the release
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras-portable
          path: extras/*.zip
          if-no-files-found: error
          retention-days: 1

      # What the release gets: installers, and the update packages (.app.tar.gz,
      # -setup.exe, .AppImage), without the throwaway signatures.
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p bundles
          find target -path '*/release/bundle/*' -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} bundles/ \;
          ls -la bundles
          [ -n "$(ls bundles)" ] || { echo "::error::no installers were built"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.platform }}
          path: bundles/*
          if-no-files-found: error
          retention-days: 1

  # Signs the update packages with the real key and makes the draft release. It
  # compiles nothing: the only code that runs with the key is the pinned Tauri
  # CLI's `signer sign` (installed with --ignore-scripts) and a short script
  # below. Put the key in the `release` Environment with required reviewers
  # (docs/SIGNING.md), so a tag alone can't start this job.
  publish:
    needs: [build]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # Creates the draft release and uploads to it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Tauri CLI (no install scripts)
        working-directory: app
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true
      - name: Sign the update packages
        shell: bash
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for f in ../bundles/*.app.tar.gz ../bundles/*-setup.exe ../bundles/*.AppImage; do
            npx --no-install tauri signer sign "$f"
            n=$((n+1))
          done
          [ "$n" -ge 3 ] || { echo "::error::expected a macOS, Windows and Linux update package, found $n"; exit 1; }
      - name: latest.json
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require("fs");
          const v = JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json", "utf8")).version;
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${v}`) throw new Error(`tag ${tag} is not v${v}`);
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/`;
          const files = fs.readdirSync("bundles");
          const entry = (name) => ({ signature: fs.readFileSync(`bundles/${name}.sig`, "utf8").trim(), url: base + encodeURIComponent(name) });
          const find = (re) => { const f = files.filter((n) => re.test(n)); if (f.length !== 1) throw new Error(`expected one ${re}, found ${f}`); return f[0]; };
          const mac = entry(find(/\.app\.tar\.gz$/));
          const platforms = {
            "darwin-aarch64": mac,
            "darwin-x86_64": mac,
            "windows-x86_64": entry(find(/-setup\.exe$/)),
            "linux-x86_64": entry(find(/\.AppImage$/)),
          };
          fs.writeFileSync("bundles/latest.json", JSON.stringify({ version: v, notes: `SketchCraft ${v}`, pub_date: new Date().toISOString(), platforms }, null, 2));
          JS
          cat bundles/latest.json
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "SketchCraft $GITHUB_REF_NAME" --notes "Draft: check the files, then publish." bundles/*

  # The headless CLI. No secrets, no write access: it builds and hands the zip on.
  cli:
    needs: [checks, guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: sketchcraft-cli-macos-arm64
            bin: sketchcraft
          - os: ubuntu-22.04
            name: sketchcraft-cli-linux-x64
            bin: sketchcraft
          - os: windows-latest
            name: sketchcraft-cli-windows-x64
            bin: sketchcraft.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --locked --release -p sketchcraft-core
      - name: Package
        shell: bash
        run: |
          mkdir dist extras
          cp target/release/${{ matrix.bin }} dist/
          cd dist && 7z a ../extras/${{ matrix.name }}.zip ${{ matrix.bin }} >/dev/null || zip ../extras/${{ matrix.name }}.zip ${{ matrix.bin }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras-${{ matrix.name }}
          path: extras/*.zip
          if-no-files-found: error
          retention-days: 1

  # Puts the CLI and portable zips on the draft, then publishes SHA256SUMS.txt
  # for every file on it (so a download can be checked against the release page).
  assets:
    needs: [publish, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extras-*
          path: extras
          merge-multiple: true
      - name: Add the zips to the draft, then its checksums
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          release() { curl -fsS "${auth[@]}" "${api}/releases?per_page=100" | jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\" and .draft)][0]"; }
          id=$(release | jq -r '.id')
          [ "$id" != "null" ] && [ -n "$id" ] || { echo "::error::No draft release for ${GITHUB_REF_NAME}."; exit 1; }
          upload() {
            curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/octet-stream" \
              --data-binary "@$1" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}/assets?name=$(basename "$1")" > /dev/null
          }
          for f in extras/*.zip; do upload "$f"; done
          # every file now on the draft (installers, latest.json, signatures, zips)
          mkdir dl
          release | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r aid name; do
            curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" "${api}/releases/assets/${aid}" -o "dl/${name}"
          done
          (cd dl && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          upload SHA256SUMS.txt
