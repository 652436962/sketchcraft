# Push a tag like v0.2.0 to build SketchCraft for macOS, Windows and Linux
# and attach the installers (plus the headless CLI) to a draft GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # set once the Apple secrets are added (see docs/SIGNING.md)
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Apple signing and notarization (only when the secrets are set)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # hand them to the build step; without them the app is signed ad hoc
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$k=${!k}" >> "$GITHUB_ENV"
          done
      - name: Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; installed copies only accept updates
          # signed with this key (public half in tauri.conf.json). Required.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: SketchCraft ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # Windows: the app as a ZIP too, to run from any folder (no installer).
      # PORTABLE.txt tells it to offer the new ZIP instead of installing updates.
      - name: Portable ZIP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable/SketchCraft | Out-Null
          Copy-Item target/release/sketchcraft-app.exe portable/SketchCraft/SketchCraft.exe
          Set-Content portable/SketchCraft/PORTABLE.txt "SketchCraft runs from this folder: unzip anywhere and open SketchCraft.exe. It needs Microsoft Edge WebView2, which Windows 10 and 11 include. When a new version is out, SketchCraft links to the newest portable ZIP."
          Compress-Archive -Path portable/SketchCraft -DestinationPath "SketchCraft_${v}_x64_portable.zip"
      - name: Attach the portable ZIP
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: SketchCraft_*_x64_portable.zip

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: sketchcraft-cli-macos-arm64
            bin: sketchcraft
          - os: ubuntu-22.04
            name: sketchcraft-cli-linux-x64
            bin: sketchcraft
          - os: windows-latest
            name: sketchcraft-cli-windows-x64
            bin: sketchcraft.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sketchcraft-core
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} dist/
          cd dist && 7z a ../${{ matrix.name }}.zip ${{ matrix.bin }} >/dev/null || zip ../${{ matrix.name }}.zip ${{ matrix.bin }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: ${{ matrix.name }}.zip
