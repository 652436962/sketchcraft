# Push a tag like v0.2.0 to build SketchCraft for macOS, Windows and Linux
# and attach the installers (plus the headless CLI, the portable ZIP and
# SHA-256 checksums) to a DRAFT GitHub release. Nothing is public until you
# review it and click "Publish release".
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the jobs that put files on the draft release get
# write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment); Dependabot (.github/dependabot.yml) proposes updates.
#
# How the update-signing key is kept away from npm code:
#   - The web UI is built in its own job (`frontend`), which has no secrets.
#     The installer jobs download that build instead of running
#     `npm run build`: tauri's beforeBuildCommand is switched off for them
#     with a --config override.
#   - Installer jobs install npm packages with --ignore-scripts, so no
#     package install script runs there.
#   - Apple signing secrets are given to the one build step that signs, never
#     written to the job environment.
# What still runs with the key in its environment: the Tauri CLI (the
# @tauri-apps/cli npm package and its prebuilt binary, pinned by
# app/package-lock.json) and Cargo build scripts of Rust dependencies (pinned
# by Cargo.lock). For more protection, the `build` job names a GitHub
# Environment, `release`: put the signing secrets in it with required
# reviewers, and add a tag protection rule (ruleset) for v* tags so only the
# maintainer can start a release (docs/SIGNING.md). Those are repository
# settings only the owner can turn on.

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # A release is a v* tag on a commit that's on main, and it names the app's own version.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the app version, and the commit is on main
        run: |
          app=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${app}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match app version ${app}."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} isn't on main. Releases are cut from main."
            exit 1
          fi

  # The web UI, built once without any secrets. The installers embed it.
  frontend:
    needs: [checks, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [frontend]
    # the signing secrets can be kept in this environment (required reviewers)
    environment: release
    permissions:
      # Creates the draft release and uploads installers and latest.json.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # set once the Apple secrets are added (see docs/SIGNING.md); only says
      # whether they exist, the values are never put in the environment
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Only for the Tauri CLI; no install scripts run.
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      # The web UI from the `frontend` job, where tauri.conf.json's frontendDist
      # (app/dist) expects it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: app/dist
      # Turns off beforeBuildCommand (`npm run build`) for this build: the UI
      # is already built, and this job holds the signing key.
      - name: Skip the frontend build hook
        shell: bash
        run: echo '{"build":{"beforeBuildCommand":""}}' > "$RUNNER_TEMP/tauri-release.json"

      # macOS with Apple signing + notarization: the secrets go to this step only.
      - name: Build, sign and notarize (macOS)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; installed copies only accept updates
          # signed with this key (public half in tauri.conf.json). Required.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: SketchCraft ${{ github.ref_name }}
          uploadUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri-release.json

      # Everything else (and macOS before the Apple secrets exist): no Apple secrets.
      - name: Build
        if: matrix.platform != 'macos-latest' || env.HAS_APPLE != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: SketchCraft ${{ github.ref_name }}
          uploadUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri-release.json

      # Windows: the app as a ZIP too, to run from any folder (no installer).
      # PORTABLE.txt tells it to offer the new ZIP instead of installing updates.
      - name: Portable ZIP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable/SketchCraft | Out-Null
          Copy-Item target/release/sketchcraft-app.exe portable/SketchCraft/SketchCraft.exe
          Set-Content portable/SketchCraft/PORTABLE.txt "SketchCraft runs from this folder: unzip anywhere and open SketchCraft.exe. It needs Microsoft Edge WebView2, which Windows 10 and 11 include. When a new version is out, SketchCraft links to the newest portable ZIP."
          New-Item -ItemType Directory -Force extras | Out-Null
          Compress-Archive -Path portable/SketchCraft -DestinationPath "extras/SketchCraft_${v}_x64_portable.zip"
      - name: Keep the portable ZIP for the release
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras-portable
          path: extras/*.zip
          if-no-files-found: error
          retention-days: 1

  # The headless CLI. No secrets, no write access: it builds and hands the zip on.
  cli:
    needs: [checks, guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: sketchcraft-cli-macos-arm64
            bin: sketchcraft
          - os: ubuntu-22.04
            name: sketchcraft-cli-linux-x64
            bin: sketchcraft
          - os: windows-latest
            name: sketchcraft-cli-windows-x64
            bin: sketchcraft.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --locked --release -p sketchcraft-core
      - name: Package
        shell: bash
        run: |
          mkdir dist extras
          cp target/release/${{ matrix.bin }} dist/
          cd dist && 7z a ../extras/${{ matrix.name }}.zip ${{ matrix.bin }} >/dev/null || zip ../extras/${{ matrix.name }}.zip ${{ matrix.bin }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras-${{ matrix.name }}
          path: extras/*.zip
          if-no-files-found: error
          retention-days: 1

  # Puts the CLI and portable zips on the draft, then publishes SHA256SUMS.txt
  # for every file on it (so a download can be checked against the release page).
  assets:
    needs: [build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extras-*
          path: extras
          merge-multiple: true
      - name: Add the zips to the draft, then its checksums
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          release() { curl -fsS "${auth[@]}" "${api}/releases?per_page=100" | jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\" and .draft)][0]"; }
          id=$(release | jq -r '.id')
          [ "$id" != "null" ] && [ -n "$id" ] || { echo "::error::No draft release for ${GITHUB_REF_NAME}."; exit 1; }
          upload() {
            curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/octet-stream" \
              --data-binary "@$1" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}/assets?name=$(basename "$1")" > /dev/null
          }
          for f in extras/*.zip; do upload "$f"; done
          # every file now on the draft (installers, latest.json, signatures, zips)
          mkdir dl
          release | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r aid name; do
            curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" "${api}/releases/assets/${aid}" -o "dl/${name}"
          done
          (cd dl && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          upload SHA256SUMS.txt
